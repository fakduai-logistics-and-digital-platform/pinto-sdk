[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinto-sdk"
version = "0.1.0"
description = "Official Python SDK for Pinto Developer Platform & SSO Auth"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
